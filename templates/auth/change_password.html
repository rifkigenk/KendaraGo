{% extends "base.html" %}

{% block title %}Ubah Password{% endblock %}

{% block content %}

  <div class="auth-page">
    <div class="auth-card">
      <h2>Ubah password</h2>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        {% for name,label in [('old_password','Password lama'),('new_password','Password baru'),('confirmation','Konfirmasi password')] %}
          <div class="mb-3">
            <label>{{ label }}</label><input type="password"
       class="form-control"
       name="{{ name }}"
       maxlength="128"
       autocomplete="{{ 'current-password' if name == 'old_password' else 'new-password' }}"
       required />
          </div>{% endfor %}<button class="btn btn-primary w-100">Simpan</button>
      </form>
    </div>
  </div>

{% endblock %}
