# ==========================================================
# 01. PENGUJIAN OTOMATIS DI GITHUB
# Menjalankan pemeriksaan format Python dan pytest pada setiap push serta pull request.
# ==========================================================

name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      # Periksa seluruh Python milik proyek, termasuk seed dan lingkungan migrasi.
      - run: python -m black --check .
      - run: python -m pytest -q
        env:
          SECRET_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WTF_CSRF_SECRET_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
